# Codegen policy for selling.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # Domain events (public extension surface) + outbound GL-posting port + validated write path
  # + the reference consumer extension (extension-contract §5).
  - "src/application/service/selling_events.rs"
  - "src/application/service/selling_gl.rs"
  - "src/application/service/selling_write_service.rs"
  - "src/application/service/selling_cart_pricing.rs"
  - "src/application/service/consumer_credit_rule_custom.rs"
  # The write surface, chunked out of selling_write_service.rs. Each is an
  # `impl SellingWriteService` block; the shared vocabulary (input structs, outcomes, errors,
  # money/price helpers, the repository bag) stays in selling_write_service.rs.
  - "src/application/service/selling_quotation.rs"
  - "src/application/service/selling_order.rs"
  - "src/application/service/selling_invoice_policy.rs"
  - "src/application/service/selling_delivery_seam.rs"
  - "src/application/service/selling_invoice_seam.rs"
  # The unit-cost port (catalog standard-cost seam) + the margin engine (pure compute + read
  # model) + the delivery-carrier registry + the expense-reinvoice link verbs.
  - "src/application/service/selling_unit_cost.rs"
  - "src/application/service/selling_margin.rs"
  - "src/application/service/selling_carrier.rs"
  - "src/application/service/selling_reinvoice.rs"
  # The stock-fulfillment port (the sale_stock confirm engine's seam to the stock module):
  # confirm-time rule launch, move-backed delivered-qty reconstruction, cancel-time log.
  - "src/application/service/selling_stock_fulfillment.rs"
  # The service-delivery confirm engine's seams: the service-tracking policy read off the
  # product surface + the confirm-time project/task mint whose outcomes become the order
  # lines' delivery backrefs.
  - "src/application/service/selling_service_catalog.rs"
  - "src/application/service/selling_service_delivery.rs"
  - "src/presentation/http/guarded_routes.rs"

  # The five document repositories own the hand-written selling SQL that the write service
  # orchestrates (the header+lines inserts, the guarded state transitions, the fulfillment
  # watermarks, the FOR UPDATE billing allocation, the template master). Declared here — not
  # renamed with a `_custom` suffix — so the generator skips them wholesale; this declaration is
  # what makes editing them legitimate. (The two SalesInvoice repositories were removed when
  # selling exited the invoice business — ADR-006.) The carrier + reinvoice-link repositories
  # are the registry/link counterparts of the same posture.
  - "src/infrastructure/persistence/quotation_repository.rs"
  - "src/infrastructure/persistence/quotation_item_repository.rs"
  - "src/infrastructure/persistence/sales_order_repository.rs"
  - "src/infrastructure/persistence/sales_order_item_repository.rs"
  - "src/infrastructure/persistence/quotation_template_repository.rs"
  - "src/infrastructure/persistence/delivery_carrier_repository.rs"
  - "src/infrastructure/persistence/expense_reinvoice_link_repository.rs"

  # Behavior tests (the golden oracle) + route probes + seam + extension-contract round-trip + BDD
  # + the margin/carrier/reinvoice suites.
  - "tests/selling_golden_cases.rs"
  - "tests/gl_posting_seam.rs"
  - "tests/integrity_probes.rs"
  - "tests/extension_contract.rs"
  - "tests/order_to_cash.rs"
  - "tests/delivery_seam.rs"
  - "tests/delivery_outbox_durability.rs"
  - "tests/sale_stock_confirm.rs"
  - "tests/sale_service_confirm.rs"
  - "tests/invoice_seam.rs"
  - "tests/quotation_machine.rs"
  - "tests/invoice_policy_compute.rs"
  - "tests/margin_compute.rs"
  - "tests/carrier_registry.rs"
  - "tests/reinvoice_link.rs"
  - "tests/features/**"

  # Per-entity CRUD integration harness. Frozen as user_owned so hand cleanups persist across regen.
  # Tradeoff: a newly-added entity will NOT auto-generate its integration test here — add it by hand.
  - "tests/integration_tests.rs"
  - "tests/integration/**"

  # The service-delivery backref migration: project_id/task_id on sales order items (the
  # confirm-mint's per-line delivery backrefs) — hand-owned ALTER pair.
  - "migrations/20260829000100_selling_service_delivery_backrefs.up.sql"
  - "migrations/20260829000100_selling_service_delivery_backrefs.down.sql"

  # Hand-authored module documentation.
  - "docs/**"
