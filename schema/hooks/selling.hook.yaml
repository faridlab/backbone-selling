# =============================================================================
# selling Hooks — lifecycle + write-path rules (declarative spec of behavior that
# lives in src/application/service/selling_*.rs and is proven in tests/).
# =============================================================================

module: selling
version: 3

# -----------------------------------------------------------------------------
# State machines
# -----------------------------------------------------------------------------
state_machines:
  # Odoo sale.order semantics, adapted: an accepted quotation converts to an
  # order; `ordered` is a one-way door (a confirmed order must never be orphaned
  # by resetting or cancelling its source quotation).
  - entity: Quotation
    field: status
    initial: draft
    states: [draft, sent, accepted, ordered, rejected, expired, cancelled]
    transitions:
      - { from: draft,    to: sent,      on: send }
      - { from: draft,    to: accepted,  on: accept }
      - { from: sent,     to: accepted,  on: accept }
      - { from: accepted, to: ordered,   on: convert_to_order }
      - { from: draft,    to: cancelled, on: cancel }
      - { from: sent,     to: cancelled, on: cancel }
      - { from: accepted, to: cancelled, on: cancel }
      - { from: sent,     to: rejected,  on: reject }
      - { from: sent,     to: draft,     on: re_draft }
      - { from: rejected, to: draft,     on: re_draft }
      - { from: cancelled,to: draft,     on: re_draft }

  # ADR-003: confirm gates BOTH bands (to_deliver_and_bill); the watermark rollup
  # advances through to_deliver / to_bill to completed when both bands are full.
  - entity: SalesOrder
    field: status
    initial: draft
    states: [draft, to_deliver, to_bill, to_deliver_and_bill, completed, closed, cancelled]
    transitions:
      - { from: draft,             to: to_deliver_and_bill, on: confirm }
      - { from: to_deliver_and_bill, to: to_bill,           on: fully_delivered }
      - { from: to_deliver_and_bill, to: to_deliver,        on: fully_billed }
      - { from: to_deliver,        to: completed,           on: fully_billed }
      - { from: to_bill,           to: completed,           on: fully_delivered }
      - { from: to_bill,           to: closed,              on: close }
      - { from: draft,             to: cancelled,           on: cancel }
      - { from: to_deliver,        to: cancelled,           on: cancel }
      - { from: to_bill,           to: cancelled,           on: cancel }
      - { from: to_deliver_and_bill, to: cancelled,         on: cancel }

# -----------------------------------------------------------------------------
# Write-path rules — each maps to a stable error_code + a golden/probe case.
# -----------------------------------------------------------------------------
rules:
  - id: R1
    name: non_empty_document
    when: create
    assert: "count(lines) >= 1"
    error_code: empty_document
  - id: R2
    name: non_negative_line
    when: create
    assert: "line.qty >= 0 AND line.price >= 0 AND line.discount >= 0 AND line.net >= 0"
    error_code: negative_quantity
  - id: R5
    name: unique_document_number
    when: create
    assert: "document number is unique"
    error_code: duplicate_number
  - id: R8
    name: accepted_to_convert
    when: convert
    assert: "quotation.status == 'accepted'"
    error_code: quotation_not_accepted
  - id: R9
    name: quotation_transition_guard
    when: send | reject | re_draft | cancel
    assert: "current status is in the verb's from-set (see the Quotation machine)"
    error_code: invalid_transition
  - id: R10
    name: quotation_cancel_refuses_ordered
    when: cancel
    assert: "quotation.status != 'ordered'"
    error_code: quotation_ordered
  - id: R11
    name: order_cancel_refuses_billed
    when: cancel
    assert: "no live order line has billed_qty > 0 (posted invoices are never cancelled)"
    error_code: order_billed
  - id: R12
    name: order_line_freeze
    when: update_order_line
    assert: "order.status == 'draft' OR only description changes"
    error_code: order_line_frozen
  - id: R13
    name: template_name_unique
    when: create_quotation_template
    assert: "(company_id, name) is unique among live templates"
    error_code: duplicate_template_name

# -----------------------------------------------------------------------------
# Invoicing policy (computed at read time; never persisted, no write route).
# The canonical basis — mirrored in list_billing_remainders, lock_billing_capacity,
# watermark_rollup (SQL) and selling_invoice_policy.rs (Rust):
#   policy_base = (invoice_policy == 'delivery' AND NOT is_downpayment) ? delivered_qty
#                                                                     : quantity
# -----------------------------------------------------------------------------
invoicing_policy:
  per_line:
    qty_to_invoice: "policy_base - billed_qty"
    invoice_status: "no | to invoice | invoiced | upselling"
  order_aggregate:
    invoice_status: "actionable-first over non-downpayment lines: any 'to invoice' > any 'upselling' > all 'invoiced' > 'no'"
  downpayment_lines: "quantity basis for the billed watermark; excluded from the order aggregate and status rollup"

# -----------------------------------------------------------------------------
# Domain events (emitted by SellingWriteService via SellingEventSink).
# -----------------------------------------------------------------------------
events:
  QuotationAccepted:
    when: "a quotation is accepted"
    payload: [quotation_id, company_id, customer_id]
  QuotationSent:
    when: "a quotation is sent to the customer"
    payload: [quotation_id, company_id]
  QuotationRejected:
    when: "a quotation is rejected by the customer"
    payload: [quotation_id, company_id, reason]
  QuotationCancelled:
    when: "a quotation is withdrawn"
    payload: [quotation_id, company_id, reason]
  QuotationReDrafted:
    when: "a quotation returns to draft for re-editing"
    payload: [quotation_id, company_id]
  SalesOrderConfirmed:
    when: "a sales order is confirmed"
    payload: [order_id, company_id, customer_id, grand_total, currency]
  SalesOrderCancelled:
    when: "a sales order is cancelled"
    payload: [order_id, company_id, customer_id]
