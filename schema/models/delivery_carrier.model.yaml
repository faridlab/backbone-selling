# =============================================================================
# Domain: Selling
# Entity: DeliveryCarrier
# Description: Delivery-carrier master — registry only. No rates, no labels, no
# carrier API surface (a later wave may add them; this pass is the name book +
# the order link). Per-tenant master data under the composing service's org
# scoping (ADR-0029); the module itself ships no tenancy column.
# =============================================================================

models:
  - name: DeliveryCarrier
    collection: delivery_carriers
    description: "Delivery carrier master (registry only — no rates, no labels, no carrier API surface)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique delivery-carrier identifier"

      name:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "Carrier display name"

      active:
        type: bool
        attributes: ["@default(true)"]
        description: "Soft retirement flag (deactivate instead of delete — orders reference the carrier)"

      tracking_url_template:
        type: string?
        attributes: ["@max(500)"]
        description: "URL template with a {tracking_ref} placeholder; null = no tracking page"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The per-unit
      # carrier-name unique is installed by the composing service's tenancy decorator
      # (org_unit_id-leading), not declared here.
