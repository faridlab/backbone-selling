# =============================================================================
# Domain: Selling
# Entity: ExpenseReinvoiceLink
# Description: A customer-rebillable employee expense attached to a sales order.
# expense_id is a LOGICAL ref to expenses.Expense (the host validates existence,
# company ownership and postability before calling attach — selling cannot
# verify it without a cargo edge; the opportunity_id posture). Selling holds
# this association; the host billing adapter PULLS pending links when it builds
# the order's customer invoice, then marks each link invoiced.
# =============================================================================

models:
  - name: ExpenseReinvoiceLink
    collection: expense_reinvoice_links
    description: "Customer-rebillable expense attached to a sales order (logical ref to expenses.Expense; the host billing adapter bills pending links and marks them invoiced)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique link identifier"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books owner # logical FK organization.Company.id (direct fencing, ADR-0010)"

      order_id:
        type: uuid
        attributes: ["@required", "@foreign_key(SalesOrder.id)"]
        description: "Owning sales order (intra-module FK)"

      expense_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Employee expense to rebill # logical FK expenses.Expense.id (no cross-module key)"

      amount:
        type: decimal
        attributes: ["@required", "@precision(18,2)", "@non_negative"]
        description: "Rebill amount in the ORDER's currency (host validates expense currency compatibility; single-currency v1)"

      state:
        type: ExpenseReinvoiceState
        attributes: ["@default(pending)"]
        description: "pending until the host billing adapter bills it, then invoiced"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      # One charge of an expense per order — the double-bill guard. The unique
      # index is partial over live rows, so a soft-deleted link can be re-attached.
      - type: unique
        fields: [order_id, expense_id]
        where: "deleted_at IS NULL"
      # The host billing adapter's queue: a company's pending links.
      - type: index
        fields: [company_id, state]

enums:
  - name: ExpenseReinvoiceState
    description: "Expense-reinvoice link lifecycle"
    variants:
      - name: pending
        description: "Attached, not yet billed"
        default: true
      - name: invoiced
        description: "Billed onto the customer invoice by the host billing adapter"
