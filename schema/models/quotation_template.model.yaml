# =============================================================================
# Domain: Selling
# Entity: QuotationTemplate
# Description: A minimal master that stamps new quotations — offer lifetime
# (validity_days applied as quotation_date + validity_days when the caller
# supplies no valid_until) and default notes. Per-tenant master data under the
# composing service's org scoping (ADR-0029); the module itself ships no
# tenancy column.
# =============================================================================

models:
  - name: QuotationTemplate
    collection: quotation_templates
    description: "Master that stamps new quotations (validity window + default notes)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique quotation-template identifier"

      name:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "Template name"

      validity_days:
        type: int
        attributes: ["@required", "@default(30)"]
        description: "Offer lifetime in days applied as quotation_date + validity_days when the caller supplies no valid_until"

      default_notes:
        type: string?
        attributes: ["@max(1000)"]
        description: "Notes stamped onto a quotation created from this template when the caller supplies none"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The per-unit
      # template-name unique is installed by the composing service's tenancy decorator
      # (org_unit_id-leading), not declared here.
